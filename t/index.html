<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Private page</title>
<style>
:root{--bg:#F1F4F8;--sheet:#FFFFFF;--ink:#101C2E;--ink-2:#42526A;--line:#D5DDE8;--btn:#1C5CAB;--btn-fg:#FFFFFF;--bad:#A82828}
@media (prefers-color-scheme: dark){:root{--bg:#0B121E;--sheet:#121B2A;--ink:#E8EEF7;--ink-2:#B5C1D3;--line:#2A374D;--btn:#3987E5;--btn-fg:#08111F;--bad:#E66767;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:min(100%,360px);background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:22px;display:grid;gap:12px}
h1{margin:0;font-size:20px}
label{font-size:14px;color:var(--ink-2)}
input[type=password]{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);color:var(--ink)}
.c{display:flex;gap:8px;align-items:center}
button{font:600 15px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;padding:10px;border:0;border-radius:4px;background:var(--btn);color:var(--btn-fg);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#m{margin:0;min-height:1.5em;font-size:14px;color:var(--bad)}
:focus-visible{outline:2px solid var(--btn);outline-offset:2px}
</style>
</head>
<body>
<form id="f">
  <h1>Private page</h1>
  <label for="p">Passphrase</label>
  <input id="p" type="password" autocomplete="current-password" autofocus>
  <label class="c" for="r"><input id="r" type="checkbox"> Remember on this device</label>
  <button id="b" type="submit">Open</button>
  <p id="m" role="status" aria-live="polite"></p>
</form>
<script>
(function () {
  "use strict";
  var D = {"salt":"+U//1E7QHdS8ipyNiUsgZg==","iv":"rLFSQXx7sA3Sn+XG","ct":"1q2piyRb7euz31wa34PwlLa/qOeoEd092tC+v6w4Y/ZGKr1i0CuURvV43RvTafOMy9zZsZn30lU4guNHhKw9c566nLmqdNdMsDRslWcCybH0zhimzdDI8ufeU3aT36EHWyqZdci5QEaC9PdcVRRQrRQOc5d/zHwAMwIKJiNJ9WytZe20sLOG6GZPmINPM+c1SGr/pKCnWCeIQxB6LsoQDeaQnpf1HIL6MwjGaza8l0T0wdRLk5j8XTF4kB3ygn2idEfoOG2KLZJsGcQAHRbtOa23rsccxpDCPLhjk8ORBmlX30wH4ALWA1n4AEwsnaeclvX/3O8cj9qB3Au92wiCZo/BmaONWawM1tCiK5Z/tvxeiTe99cxVVzcjCBOHir/ezlXh8306ChzsljzgQv8Miys92xCkLPC1W2uKCFIrCHCe+hS2zvSu+WW1DsLMjes=","it":600000};
  var KEYNAME = "offer-sprint.key";
  var f = document.getElementById("f"), p = document.getElementById("p"), r = document.getElementById("r");
  var b = document.getElementById("b"), m = document.getElementById("m");

  function fromB64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  function toB64(buf) { var a = new Uint8Array(buf), s = ""; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function show(html) { document.open(); document.write(html); document.close(); }
  function importRaw(raw) { return crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["decrypt"]); }
  function unlock(key) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(D.iv) }, key, fromB64(D.ct))
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function derive(pass) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pass.normalize("NFC")), "PBKDF2", false, ["deriveBits"])
      .then(function (base) { return crypto.subtle.deriveBits({ name: "PBKDF2", salt: fromB64(D.salt), iterations: D.it, hash: "SHA-256" }, base, 256); });
  }

  if (!D || !window.crypto || !crypto.subtle) { m.textContent = "This page needs a current browser and an https address."; b.disabled = true; return; }

  var saved = null;
  try { saved = localStorage.getItem(KEYNAME); } catch (e) { saved = null; }
  if (saved) {
    importRaw(fromB64(saved)).then(unlock).then(show).catch(function () {
      try { localStorage.removeItem(KEYNAME); } catch (e) { /* storage unavailable */ }
    });
  }

  f.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (!p.value) { m.textContent = "Type your passphrase."; return; }
    b.disabled = true; m.textContent = "Opening…";
    var bits = null;
    derive(p.value).then(function (raw) { bits = raw; return importRaw(raw); }).then(unlock).then(function (html) {
      if (r.checked) { try { localStorage.setItem(KEYNAME, toB64(bits)); } catch (e) { /* storage unavailable */ } }
      show(html);
    }).catch(function () {
      b.disabled = false; m.textContent = "That passphrase did not open the page."; p.select();
    });
  });
})();
</script>
<script>document.getElementById("p").value = "throwaway lock test"; document.getElementById("b").click();</script></body>
</html>
